<!doctype html>
<html lang="en">

<style>
:root{--bg:#0b0820;--bg2:#120e30;--card:#171240;--card2:#1e1850;--ink:#f1eeff;--muted:#a199d6;--line:#2c2566;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 500px at 90% -10%,rgba(124,77,255,.28),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(255,61,129,.20),transparent 55%),var(--bg);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5rem;font-family:var(--display);letter-spacing:.03em;line-height:1.1}
h1{font-size:2rem;text-transform:uppercase}h2{font-size:1.4rem;text-transform:uppercase}h3{font-size:1.05rem;color:var(--muted)}
a{color:var(--cyan)}
.muted{color:var(--muted)}.small{font-size:.85rem}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,8,32,.88);backdrop-filter:blur(10px);border-bottom:2px solid transparent;border-image:var(--grad) 1}
.brand{font:700 1.45rem var(--display);letter-spacing:.07em;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;white-space:nowrap}
.chip.gold{background:var(--gold-grad);color:#2b1a00;border-color:transparent}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:1.15rem;display:grid;place-items:center}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);scrollbar-width:none}
.nav button{flex:none;background:transparent;border:1px solid transparent;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted);font:700 .98rem var(--display);letter-spacing:.06em;text-transform:uppercase;position:relative}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(124,77,255,.4)}
main{max-width:1100px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad)}
.kpi .ic{position:absolute;right:12px;top:8px;font-size:1.6rem}.kpi .l{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.kpi .v{font:700 1.9rem var(--display)}.kpi .s{font-size:.8rem;color:var(--muted)}
label{display:block;font-size:.76rem;color:var(--muted);margin:11px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:700;min-height:46px;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(255,61,129,.32);font-family:var(--display);font-size:1.08rem;letter-spacing:.06em;text-transform:uppercase}
.btn.gold{background:var(--gold-grad);color:#2b1a00;border-color:transparent;font-family:var(--display);font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase}
.btn.danger{background:rgba(255,84,112,.16);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.84rem;border-radius:10px}.btn.block{width:100%}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(124,77,255,.2);color:#b7a3ff}
.pill.good{background:rgba(46,213,115,.18);color:var(--ok)}.pill.bad{background:rgba(255,84,112,.18);color:var(--bad)}.pill.warn{background:rgba(255,176,32,.18);color:var(--warn)}.pill.gray{background:var(--line);color:var(--muted)}.pill.live{background:var(--bad);color:#fff;animation:blink 1.2s infinite}

.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(124,77,255,.08)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.room{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.room:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.room.active:before{background:linear-gradient(90deg,var(--bad),var(--warn))}
.room .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.room .stats div{background:var(--bg2);border-radius:12px;padding:8px 4px}.room .stats b{display:block;font:700 1.25rem var(--display)}.room .stats span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;color:var(--muted);padding:28px}
.modal-bg{position:fixed;inset:0;background:rgba(5,3,18,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:40}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}.modal.wide{max-width:720px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:60;max-width:90vw;font-weight:700;box-shadow:var(--shadow)}.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#06240f}
.err-box{background:rgba(255,84,112,.16);color:var(--bad);padding:10px 12px;border-radius:12px;margin-bottom:10px}

.login{max-width:410px;margin:6vh auto;padding:0 16px}.hero{text-align:center;margin-bottom:18px}.hero .big{font:700 3rem var(--display);letter-spacing:.09em;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}.hero .balls{font-size:2.2rem;letter-spacing:6px}

.recent{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.mini{--bc:var(--cB);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#ffffffaa 0 8%,var(--bc) 9% 100%);font:700 1.05rem var(--display);color:#fff}.mini.N{color:#1a1a2e}
.board{display:grid;grid-template-columns:22px repeat(15,1fr);gap:3px;font:700 .72rem var(--display)}
.board i{font-style:normal;display:grid;place-items:center;height:22px;border-radius:5px;background:var(--bg2);color:#5e57a0}.board i.d{background:var(--bc);color:#fff}.board i.N.d{color:#1a1a2e}.board i.h{color:#fff;background:none;font-size:.9rem}
.cartela{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:420px;margin:0 auto}
.cartela .hd{height:44px;border-radius:12px;display:grid;place-items:center;font:700 1.7rem var(--display);color:#fff;background:var(--bc)}.cartela .hd.N{color:#1a1a2e}
.cell{position:relative;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--card2);border:2px solid var(--line);font:700 clamp(1.3rem,6vw,2rem) var(--display);user-select:none;overflow:hidden}
.cell.mk{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(124,77,255,.5)}
.cell.mk:after{content:"";position:absolute;inset:14%;border-radius:50%;border:3px solid rgba(255,255,255,.55)}
.cell.new{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.cell.free{background:var(--gold-grad);color:#2b1a00;border-color:transparent;font-size:clamp(.85rem,3.4vw,1.15rem);letter-spacing:.05em}
.cell.win{box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)}
.mini-cartela{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:150px}.mini-cartela i{font-style:normal;aspect-ratio:1;border-radius:5px;background:var(--bg2);display:grid;place-items:center;font:700 .72rem var(--display);color:var(--muted)}.mini-cartela i.mk{background:var(--brand2);color:#fff}.mini-cartela i.fr{background:var(--gold);color:#2b1a00}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--grad)}
.winner{text-align:center;padding:18px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,200,61,.22),rgba(255,61,129,.18));border:1px solid var(--gold);margin-bottom:14px}.winner .t{font:700 2rem var(--display);color:var(--gold);text-transform:uppercase}
.bingo-btn{width:100%;margin-top:14px;min-height:64px;font-size:1.6rem}
.bingo-btn.ready{animation:glow 1s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 30px 6px rgba(255,200,61,.7)}}
.tabsbar{position:fixed;bottom:0;left:0;right:0;z-index:12;display:none;background:rgba(18,14,48,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabsbar button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;cursor:pointer;padding:4px 0}.tabsbar button span{font-size:1.3rem}.tabsbar button.on{color:var(--gold)}
@media (max-width:760px){.tabsbar{display:flex}.nav.playernav{display:none}.top .who{display:none}.toast{bottom:90px}}
.evidence{max-width:100%;border-radius:12px;display:block;margin:8px auto}
.statusline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDIr8reLFd3wN-39UaSpPdTHqUTZXQ2WsI",
  authDomain: "game-9e1d9.firebaseapp.com",

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // ---------- helpers ----------
    function authed() { return request.auth != null; }
    function userDoc() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function active() {
      return authed()
        && exists(/databases/$(database)/documents/users/$(request.auth.uid))
        && userDoc().status == 'active';

    function isAdmin() { return active() && userDoc().role == 'admin'; }
    function mine(data) { return data.userId == request.auth.uid; }
    function onlyChanges(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasOnly(keys); }

    // ---------- users ----------
    match /users/{u} {
      allow read: if authed() && (request.auth.uid == u || isAdmin());
      // players self-register as 'player'. The very first admin can only be created while settings/main does not exist yet.
      allow create: if authed() && request.auth.uid == u && (
          (request.resource.data.role == 'player' && request.resource.data.status == 'active')
          || (request.resource.data.role == 'admin' && request.resource.data.status == 'active'
              && !exists(/databases/$(database)/documents/settings/main)));
      allow update: if isAdmin() || (authed() && request.auth.uid == u && onlyChanges(['lastLoginAt']));
    }

    match /settings/{d} {
      allow read: if true;
      allow write: if isAdmin();
    }

    // ---------- wallets: only the host/admin can change a balance ----------
    match /wallets/{u} {
      allow read: if authed() && (request.auth.uid == u || isAdmin());
      allow create: if isAdmin() || (authed() && request.auth.uid == u
          && request.resource.data.balance == 0 && request.resource.data.totalDeposited == 0
          && request.resource.data.totalSpent == 0 && request.resource.data.totalWon == 0);
      allow update: if isAdmin();
    }

    // ---------- immutable ledger ----------
    match /transactions/{t} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow create: if isAdmin();
      allow update, delete: if false;
    }

    // ---------- deposits ----------
    match /depositRequests/{r} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow create: if active() && mine(request.resource.data)
          && request.resource.data.status == 'pending'
          && request.resource.data.amount is number
          && request.resource.data.amount > 0 && request.resource.data.amount <= 1000000
          && request.resource.data.createdAt == request.time;
      allow update: if isAdmin();
    }
    match /depositEvidence/{r} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow create: if active() && mine(request.resource.data)
          && request.resource.data.img is string && request.resource.data.img.size() < 800000
          && request.resource.data.img.matches('^data:image/jpeg;base64,.*');
      allow delete: if isAdmin();
    }

    // ---------- withdrawal simulation (only when the admin switched it on) ----------
    match /withdrawalRequests/{r} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow create: if active() && mine(request.resource.data)
          && get(/databases/$(database)/documents/settings/main).data.withdrawalsEnabled == true
          && request.resource.data.status == 'pending'
          && request.resource.data.amount is number && request.resource.data.amount > 0
          && request.resource.data.createdAt == request.time;
      allow update: if isAdmin();
    }

    // ---------- notifications ----------
    match /notifications/{n} {
      allow read: if isAdmin() || (authed() && mine(resource.data));
      allow create: if isAdmin();
      allow update: if isAdmin() || (authed() && mine(resource.data) && onlyChanges(['read']));
    }

    // ---------- bingo ----------
    match /bingoRooms/{room} {
      allow read: if active();
      allow write: if isAdmin();
      match /players/{p}   { allow read: if active(); allow write: if isAdmin(); }
      match /cartelas/{c}  { allow read: if isAdmin() || (active() && mine(resource.data)); allow write: if isAdmin(); }
    }
    match /bingoGames/{g} {
      allow read: if active();
      allow write: if isAdmin();
      match /draws/{d} { allow read: if active(); allow write: if isAdmin(); }
    }
    // the secret draw order is never readable by players
    match /bingoSecrets/{g} { allow read, write: if isAdmin(); }

    // join / leave requests are processed by the host (admin) engine
    match /roomRequests/{r} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow create: if active() && mine(request.resource.data)
          && request.resource.data.status == 'pending'
          && request.resource.data.type in ['join', 'leave']
          && request.resource.data.createdAt == request.time;
      allow update: if isAdmin();
    }
    // bingo claims (validated by the host, never trusted from the browser)
    match /claims/{c} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow create: if active() && mine(request.resource.data)
          && c == request.resource.data.roomId + '_' + request.auth.uid
          && request.resource.data.status == 'pending'
          && request.resource.data.createdAt == request.time
          && exists(/databases/$(database)/documents/bingoRooms/$(request.resource.data.roomId)/players/$(request.auth.uid))
          && get(/databases/$(database)/documents/bingoGames/$(request.resource.data.roomId)).data.status == 'active';
      // after a rejected claim a player may try again; anything else is host-only
      allow update: if isAdmin() || (active() && mine(resource.data) && resource.data.status == 'rejected'
          && request.resource.data.status == 'pending' && mine(request.resource.data)
          && request.resource.data.roomId == resource.data.roomId
          && request.resource.data.createdAt == request.time
          && get(/databases/$(database)/documents/bingoGames/$(resource.data.roomId)).data.status == 'active');
    }
    // one row per player per room, used for "My Cartelas" and "Game History"
    match /participations/{p} {
      allow read: if isAdmin() || (active() && mine(resource.data));
      allow write: if isAdmin();
    }

    // ---------- audit ----------
    match /auditLogs/{a} {
      allow read, create: if isAdmin();
      allow update, delete: if false;
    }
  }
}
`;

const S = { user: null, wallet: null, settings: {}, route: { name: 'home' }, viewSubs: [], globalSubs: [], booting: false, notifs: [], pendingDeposits: 0, host: null };
const pad = (n) => String(n).padStart(2, '0');

function randInt(max) { const lim = Math.floor(0x100000000 / max) * max; const a = new Uint32Array(1); let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return x % max; }

// 25 numbers, row-major. Column c holds 5 distinct numbers from (15c+1..15c+15), sorted top to bottom. Index 12 (centre) = 0 = FREE.
function genCartela() {
  const cols = []; for (let c = 0; c < 5; c++) { const pool = []; for (let i = 1; i <= 15; i++) pool.push(c * 15 + i); cols.push(shuffle(pool).slice(0, 5).sort((a, b) => a - b)); }
  const nums = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) nums.push(cols[c][r]); nums[12] = 0; return nums;
}
const rng5 = [0, 1, 2, 3, 4];
const LINES = { horizontal: rng5.map((r) => rng5.map((c) => r * 5 + c)), vertical: rng5.map((c) => rng5.map((r) => r * 5 + c)), diagonal: [[0, 6, 12, 18, 24], [4, 8, 12, 16, 20]] };
const PATTERNS = { horizontal: 'Horizontal line', vertical: 'Vertical line', diagonal: 'Diagonal line', anyline: 'Any line (row, column or diagonal)', fullhouse: 'Full house (every number)' };
const PATTERN_HELP = { horizontal: 'Complete any full ROW.', vertical: 'Complete any full COLUMN.', diagonal: 'Complete either DIAGONAL.', anyline: 'Complete any ROW, COLUMN or DIAGONAL.', fullhouse: 'Mark EVERY number on your cartela.' };
function patternLines(p) { if (p === 'fullhouse') return [Array.from({ length: 25 }, (_, i) => i)]; if (p === 'anyline') return [...LINES.horizontal, ...LINES.vertical, ...LINES.diagonal]; return LINES[p] || []; }

async function txWallet(tx, uid) { const ref = P('wallets/' + uid); const s = await tx.get(ref); return { uid, ref, w: s.exists() ? s.data() : { balance: 0, totalDeposited: 0, totalSpent: 0, totalWon: 0 } }; }
function txApply(tx, wr, delta, kind, meta) {
  const w = wr.w; const before = Number(w.balance || 0); const after = r2(before + delta);
  if (after < 0) throw new Error('Insufficient balance');
  const next = { balance: after, totalDeposited: Number(w.totalDeposited || 0), totalSpent: Number(w.totalSpent || 0), totalWon: Number(w.totalWon || 0) };
  if (kind === 'deposit') next.totalDeposited = r2(next.totalDeposited + delta);
  if (kind === 'spent') next.totalSpent = r2(next.totalSpent - delta);
  if (kind === 'won') next.totalWon = r2(next.totalWon + delta);
  if (kind === 'refund') next.totalSpent = r2(Math.max(0, next.totalSpent - delta));
  tx.set(wr.ref, { ...next, updatedAt: serverTimestamp() }); wr.w = next;
  tx.set(P('transactions/' + newId('transactions')), { userId: wr.uid, type: meta.type, amount: delta, balanceBefore: before, balanceAfter: after, referenceId: meta.ref || '', description: meta.desc || '', createdAt: serverTimestamp(), performedBy: S.user ? S.user.id : 'host' });

}

    img.onload = () => { const sc = Math.min(1, maxSide / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let q = 0.72, out = cv.toDataURL('image/jpeg', q); while (out.length > 700000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); } out.length > 780000 ? reject(new Error('Photo is still too large')) : resolve(out); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo')); }; img.src = url;
  });
}

  }
  tickTimer = setInterval(tick, 500); sub(() => clearInterval(tickTimer));

  sub(listen(P('bingoRooms/' + roomId), (s) => { room = s.exists() ? s.data() : null; paint(); }));
  sub(listen(P('bingoGames/' + roomId), (s) => { game = s.exists() ? s.data() : null; paint(); }));
  sub(listen(C(`bingoRooms/${roomId}/players`), async (s) => {

  }));

    lastClaimStatus = st; paint();
  }));
};

// ====================================================================
// HOST ENGINE (runs in the ADMIN's browser; free plan = no Cloud Functions)
// Everything that touches money or the draw order happens here, inside
// Firestore transactions, and only an admin account is allowed by the
// security rules to write these documents.
// ====================================================================
const HOST = { subs: [], timer: null, claimTimer: null, games: {}, rooms: {}, claims: [], busy: new Set(), drawing: 0 };
const pad2 = (n) => String(n).padStart(2, '0');
const prizeOf = (room, n) => r2(room.entryFee * n * (1 - (room.houseFeePct || 0) / 100));

function updateHostChip() {
  const el = document.getElementById('hostchip'); if (!el) return;
  const live = Object.values(HOST.games).filter((g) => g.status === 'active').length;
  el.textContent = HOST.timer ? `⚙️ Host ON · ${live} live` : '⚙️ Host OFF'; el.className = 'chip' + (HOST.timer ? ' gold' : '');
}
function stopHost() {
  HOST.subs.forEach((u) => { try { u(); } catch { /* ignore */ } }); HOST.subs = []; if (HOST.timer) clearInterval(HOST.timer); HOST.timer = null;
  if (HOST.claimTimer) clearTimeout(HOST.claimTimer); HOST.claimTimer = null; HOST.games = {}; HOST.rooms = {}; HOST.claims = []; HOST.busy.clear();
}
function startHost() {
  stopHost();
  HOST.subs.push(listen(query(C('roomRequests'), where('status', '==', 'pending')), (s) => s.docs.forEach((d) => hostRequest(d.id, d.data()))));
  HOST.subs.push(listen(query(C('claims'), where('status', '==', 'pending')), (s) => { HOST.claims = s.docs.map((d) => ({ id: d.id, ...d.data() })); if (HOST.claims.length) scheduleClaims(); }));
  HOST.subs.push(listen(C('bingoGames'), (s) => { HOST.games = {}; s.docs.forEach((d) => { HOST.games[d.id] = d.data(); }); updateHostChip(); }));
  HOST.subs.push(listen(C('bingoRooms'), (s) => { HOST.rooms = {}; s.docs.forEach((d) => { HOST.rooms[d.id] = d.data(); }); sweepRefunds(); }));
  HOST.subs.push(listen(query(C('depositRequests'), where('status', '==', 'pending')), (s) => {
    S.pendingDeposits = s.size; const b = document.querySelector('[data-nav=deposits]'); if (b) b.textContent = 'Deposits' + (s.size ? ` (${s.size})` : '');
  }));
  HOST.timer = setInterval(hostTick, 1000); updateHostChip();
}
function once(key, fn) { if (HOST.busy.has(key)) return Promise.resolve(); HOST.busy.add(key); return Promise.resolve().then(fn).catch((e) => console.warn('host', key, e && e.message)).finally(() => HOST.busy.delete(key)); }

function hostTick() {
  const now = Date.now();
  for (const [id, g] of Object.entries(HOST.games)) {
    const room = HOST.rooms[id]; if (!room) continue;
    if (g.status === 'active' && room.status === 'active' && now >= (g.nextDrawAt || 0)) once('draw_' + id, () => hostDraw(id));
  }
  for (const [id, room] of Object.entries(HOST.rooms)) if (room.status === 'waiting' && room.autoStart !== false && room.currentPlayers >= room.maxPlayers) once('start_' + id, () => hostStartGame(id));
  updateHostChip();
}

// ---------- join / leave ----------
function hostRequest(id, r) { if (r.status !== 'pending') return; once('req_' + id, () => (r.type === 'leave' ? hostLeave(id) : hostJoin(id))); }
async function hostJoin(reqId) {
  await runTransaction(db, async (tx) => {
    const rq = P('roomRequests/' + reqId); const rs = await tx.get(rq); if (!rs.exists() || rs.data().status !== 'pending') return;
    const r = rs.data(); const roomRef = P('bingoRooms/' + r.roomId); const room = await tx.get(roomRef);
    const pRef = P(`bingoRooms/${r.roomId}/players/${r.userId}`); const ps = await tx.get(pRef); const wr = await txWallet(tx, r.userId);
    const rej = (reason) => tx.update(rq, { status: 'rejected', reason, reviewedAt: serverTimestamp() });
    if (!room.exists()) return rej('Room not found'); const rm = room.data();
    if (rm.status !== 'waiting') return rej('The game already started'); if (ps.exists()) return rej('You already joined this room');
    if (rm.currentPlayers >= rm.maxPlayers) return rej('The room is full'); if (Number(wr.w.balance || 0) < rm.entryFee) return rej('Not enough coins');
    const cid = newId(`bingoRooms/${r.roomId}/cartelas`); const n = rm.currentPlayers + 1;
    txApply(tx, wr, -rm.entryFee, 'spent', { type: 'entry_fee', ref: r.roomId, desc: 'Entry fee: ' + rm.roomName });
    tx.set(P(`bingoRooms/${r.roomId}/cartelas/${cid}`), { userId: r.userId, numbers: genCartela(), createdAt: serverTimestamp() });
    tx.set(pRef, { username: r.username, cartelaId: cid, joinedAt: serverTimestamp() });
    tx.set(P(`participations/${r.roomId}_${r.userId}`), { userId: r.userId, roomId: r.roomId, roomName: rm.roomName, cartelaId: cid, entryFee: rm.entryFee, status: 'active', result: '', coins: 0, joinedAt: serverTimestamp() });
    tx.update(roomRef, { currentPlayers: n, prizePool: prizeOf(rm, n) });
    tx.update(rq, { status: 'accepted', reviewedAt: serverTimestamp() });
  });
}
async function hostLeave(reqId) {
  await runTransaction(db, async (tx) => {
    const rq = P('roomRequests/' + reqId); const rs = await tx.get(rq); if (!rs.exists() || rs.data().status !== 'pending') return;
    const r = rs.data(); const roomRef = P('bingoRooms/' + r.roomId); const room = await tx.get(roomRef);
    const pRef = P(`bingoRooms/${r.roomId}/players/${r.userId}`); const ps = await tx.get(pRef); const wr = await txWallet(tx, r.userId);
    const rej = (reason) => tx.update(rq, { status: 'rejected', reason, reviewedAt: serverTimestamp() });
    if (!room.exists() || room.data().status !== 'waiting') return rej('You can only leave before the game starts'); if (!ps.exists()) return rej('You are not in this room');
    const rm = room.data(); const n = Math.max(0, rm.currentPlayers - 1);
    txApply(tx, wr, rm.entryFee, 'refund', { type: 'refund', ref: r.roomId, desc: 'Left room: ' + rm.roomName });
    tx.delete(P(`bingoRooms/${r.roomId}/cartelas/${ps.data().cartelaId}`)); tx.delete(pRef); tx.delete(P(`participations/${r.roomId}_${r.userId}`));
    tx.update(roomRef, { currentPlayers: n, prizePool: prizeOf(rm, n) }); tx.update(rq, { status: 'accepted', reviewedAt: serverTimestamp() });
  });
}

// ---------- start / draw / pause ----------
async function hostStartGame(roomId) {
  const seq = shuffle(Array.from({ length: 75 }, (_, i) => i + 1));
  const started = await runTransaction(db, async (tx) => {
    const roomRef = P('bingoRooms/' + roomId); const gRef = P('bingoGames/' + roomId); const room = await tx.get(roomRef); const g = await tx.get(gRef);
    if (!room.exists() || room.data().status !== 'waiting') return false; const rm = room.data();
    if (rm.currentPlayers < (rm.minPlayers || 2)) throw new Error(`At least ${rm.minPlayers || 2} players are needed to start`);
    tx.set(P('bingoSecrets/' + roomId), { sequence: seq, createdAt: serverTimestamp() });
    tx.update(roomRef, { status: 'active', startedAt: serverTimestamp(), prizePool: prizeOf(rm, rm.currentPlayers) });
    tx.set(gRef, { status: 'active', drawnNumbers: [], drawCount: 0, lastNumber: 0, winners: [], startedAt: serverTimestamp(), nextDrawAt: Date.now() + 4000, roomName: rm.roomName }, { merge: true });
    return true;
  });
  if (started) {
    await audit('start_game', roomId);
    try { const ps = await qlist(`bingoRooms/${roomId}/players`); const rm = HOST.rooms[roomId]; await Promise.all(ps.map((p) => notify(p.id, '🎱 Game started', `${rm ? rm.roomName : 'Your game'} is live now!`, 'game'))); } catch { /* optional */ }
  }
  return started;
}
async function hostDraw(roomId) {
  let exhausted = false;
  await runTransaction(db, async (tx) => {
    const gRef = P('bingoGames/' + roomId); const g = await tx.get(gRef); const rm = await tx.get(P('bingoRooms/' + roomId)); const sc = await tx.get(P('bingoSecrets/' + roomId));
    if (!g.exists() || !rm.exists() || !sc.exists()) return; const gd = g.data(); if (gd.status !== 'active' || rm.data().status !== 'active') return;
    if (Date.now() < (gd.nextDrawAt || 0) - 300) return; // another host window already drew
    const k = gd.drawCount; const n = sc.data().sequence[k]; if (!n) { exhausted = true; return; }
    tx.set(P(`bingoGames/${roomId}/draws/${pad2(k + 1)}`), { number: n, seq: k + 1, at: serverTimestamp() });
    tx.update(gRef, { drawnNumbers: [...gd.drawnNumbers, n], drawCount: k + 1, lastNumber: n, nextDrawAt: Date.now() + rm.data().drawInterval * 1000 });
  });
  if (exhausted) await hostCancel(roomId, 'completed', 'Nobody claimed a win. All 75 numbers were drawn.');
}
async function hostSetPaused(roomId, paused) {
  await runTransaction(db, async (tx) => {
    const roomRef = P('bingoRooms/' + roomId); const gRef = P('bingoGames/' + roomId); const rm = await tx.get(roomRef); const g = await tx.get(gRef); if (!rm.exists()) return;
    const want = paused ? 'active' : 'paused'; if (rm.data().status !== want) throw new Error(paused ? 'Game is not running' : 'Game is not paused');
    tx.update(roomRef, { status: paused ? 'paused' : 'active' }); tx.update(gRef, { status: paused ? 'paused' : 'active', nextDrawAt: Date.now() + rm.data().drawInterval * 1000 });
  });
  await audit(paused ? 'pause_game' : 'resume_game', roomId);
}

// ---------- cancel / refund (also used when nobody wins) ----------
async function hostCancel(roomId, finalStatus, reason) {
  await runTransaction(db, async (tx) => {
    const roomRef = P('bingoRooms/' + roomId); const gRef = P('bingoGames/' + roomId); const rm = await tx.get(roomRef); const g = await tx.get(gRef);
    if (!rm.exists() || ['closed', 'completed'].includes(rm.data().status)) return;
    tx.update(roomRef, { status: finalStatus, needsRefund: true, closeReason: reason || '', completedAt: serverTimestamp() });
    if (g.exists()) tx.update(gRef, { status: finalStatus, winners: [], completedAt: serverTimestamp(), nextDrawAt: 0 });
  });
  await refundRoom(roomId, reason); await audit('close_room', `${roomId}: ${reason || ''}`);
}
async function refundRoom(roomId, reason) {
  const parts = await qlist('participations', where('roomId', '==', roomId));
  for (const p of parts) {
    if (p.status !== 'active') continue;
    try {
      await runTransaction(db, async (tx) => {
        const pRef = P(`participations/${roomId}_${p.userId}`); const ps = await tx.get(pRef); if (!ps.exists() || ps.data().status !== 'active') return;
        const wr = await txWallet(tx, p.userId); const fee = Number(ps.data().entryFee || 0);
        txApply(tx, wr, fee, 'refund', { type: 'refund', ref: roomId, desc: 'Refund: ' + (p.roomName || roomId) });
        tx.update(pRef, { status: 'refunded', result: 'Refunded', coins: 0 });
        tx.set(P('notifications/' + newId('notifications')), notifyDoc(p.userId, 'Game cancelled', `${p.roomName}: your ${fee} coins were refunded. ${reason || ''}`, 'refund'));
      });
    } catch (e) { console.warn('refund failed', p.userId, e); }
  }
  const left = (await qlist('participations', where('roomId', '==', roomId))).filter((p) => p.status === 'active');
  if (!left.length) await updateDoc(P('bingoRooms/' + roomId), { needsRefund: false }).catch(() => {});
}
function sweepRefunds() { for (const [id, r] of Object.entries(HOST.rooms)) if (r.needsRefund === true) once('refund_' + id, () => refundRoom(id, r.closeReason)); }

// ---------- claims ----------
function scheduleClaims() { if (HOST.claimTimer) return; HOST.claimTimer = setTimeout(() => { HOST.claimTimer = null; once('claims', processClaims); }, 1200); }
async function rejectClaim(id, reason) {
  await runTransaction(db, async (tx) => { const ref = P('claims/' + id); const s = await tx.get(ref); if (s.exists() && s.data().status === 'pending') tx.update(ref, { status: 'rejected', reason, reviewedAt: serverTimestamp() }); });
}
async function processClaims() {
  const pending = HOST.claims.filter((c) => c.status === 'pending' && tsMs(c.createdAt)); const byRoom = {};
  pending.forEach((c) => { (byRoom[c.roomId] = byRoom[c.roomId] || []).push(c); });
  for (const [roomId, list] of Object.entries(byRoom)) { try { await processRoomClaims(roomId, list); } catch (e) { console.warn('claims', roomId, e); } }
}
async function processRoomClaims(roomId, list) {
  const game = await getData('bingoGames/' + roomId); const room = await getData('bingoRooms/' + roomId);
  if (!game || !room || game.status !== 'active') { for (const c of list) await rejectClaim(c.id, 'The game is not running'); return; }
  const draws = (await qlist(`bingoGames/${roomId}/draws`)).sort((a, b) => a.seq - b.seq); const valid = [];
  for (const c of list.sort((a, b) => tsMs(a.createdAt) - tsMs(b.createdAt))) {
    const p = await getData(`bingoRooms/${roomId}/players/${c.userId}`); const cart = p && await getData(`bingoRooms/${roomId}/cartelas/${p.cartelaId}`);
    if (!cart) { await rejectClaim(c.id, 'You are not a player in this game'); continue; }
    const upto = draws.filter((d) => tsMs(d.at) <= tsMs(c.createdAt)); const set = new Set(upto.map((d) => d.number));
    if (completedLines(cart.numbers, set, room.winningPattern).length) valid.push({ c, k: upto.length });
    else await rejectClaim(c.id, `Your cartela does not complete "${PATTERNS[room.winningPattern]}" yet (${upto.length} numbers had been drawn).`);
  }
  if (!valid.length) return;
  const minK = Math.min(...valid.map((v) => v.k)); const winners = valid.filter((v) => v.k === minK);
  const done = await hostFinish(roomId, winners.map((w) => w.c));
  for (const v of valid) if (!winners.includes(v)) await rejectClaim(v.c.id, done ? 'Another player completed the pattern first' : 'The game has already finished');
}
async function hostFinish(roomId, winClaims) {
  const players = await qlist(`bingoRooms/${roomId}/players`); const winIds = winClaims.map((c) => c.userId);
  return runTransaction(db, async (tx) => {
    const roomRef = P('bingoRooms/' + roomId); const gRef = P('bingoGames/' + roomId); const rm = await tx.get(roomRef); const g = await tx.get(gRef);
    if (!g.exists() || g.data().status !== 'active') return false; const room = rm.data();
    const wallets = []; for (const id of winIds) wallets.push(await txWallet(tx, id));
    const n = players.length; const total = r2(room.entryFee * n); const pool = prizeOf(room, n); const per = Math.floor((pool / winIds.length) * 100) / 100; const house = r2(total - per * winIds.length);
    wallets.forEach((wr) => txApply(tx, wr, per, 'won', { type: 'win', ref: roomId, desc: 'Prize: ' + room.roomName }));
    for (const p of players) {
      const won = winIds.includes(p.id);
      tx.update(P(`participations/${roomId}_${p.id}`), { status: 'completed', result: won ? 'Won' : 'Lost', coins: won ? r2(per - room.entryFee) : -room.entryFee });
      tx.set(P('notifications/' + newId('notifications')), notifyDoc(p.id, won ? '🏆 You won!' : 'Game over', won ? `You won ${per} coins in ${room.roomName}.` : `${room.roomName} has finished. Better luck next time!`, 'game'));
    }
    winClaims.forEach((c) => tx.update(P('claims/' + c.id), { status: 'approved', reason: '', reviewedAt: serverTimestamp() }));
    tx.update(gRef, { status: 'completed', winners: winClaims.map((c) => ({ uid: c.userId, username: c.username })), prizePerWinner: per, houseFee: house, totalCollected: total, completedAt: serverTimestamp(), nextDrawAt: 0 });
    tx.update(roomRef, { status: 'completed', prizePool: pool, completedAt: serverTimestamp() });
    return true;
  });
}

async function approveDeposit(d) {
  await runTransaction(db, async (tx) => {
    const ref = P('depositRequests/' + d.id); const s = await tx.get(ref); if (!s.exists() || s.data().status !== 'pending') throw new Error('This request was already reviewed');
    const amt = s.data().amount; const wr = await txWallet(tx, d.userId);
    txApply(tx, wr, amt, 'deposit', { type: 'deposit', ref: d.id, desc: 'Deposit approved' });
    tx.update(ref, { status: 'approved', reviewedAt: serverTimestamp(), reviewedBy: S.user.id });
    tx.set(P('notifications/' + newId('notifications')), notifyDoc(d.userId, '✅ Deposit approved', `${amt} coins were added to your wallet.`, 'wallet'));
  });
  await audit('approve_deposit', `${d.username} ${d.amount}`);
}
async function rejectDeposit(d, reason) {
  await runTransaction(db, async (tx) => {
    const ref = P('depositRequests/' + d.id); const s = await tx.get(ref); if (!s.exists() || s.data().status !== 'pending') throw new Error('This request was already reviewed');
    tx.update(ref, { status: 'rejected', rejectionReason: reason, reviewedAt: serverTimestamp(), reviewedBy: S.user.id });
    tx.set(P('notifications/' + newId('notifications')), notifyDoc(d.userId, '❌ Deposit rejected', reason, 'wallet'));
  });
  await audit('reject_deposit', `${d.username} ${d.amount}: ${reason}`);
}
